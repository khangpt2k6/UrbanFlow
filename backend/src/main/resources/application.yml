server:
  port: 8080

spring:
  application:
    name: trafficflow

simulation:
  # Parallel plan-phase worker pool size. 24 workers + 6 named service threads = ~30 total.
  worker-threads: 24
  # Ticks per second (Hz). At 30 Hz the engine sustains 2,100+ vehicle-updates/sec (tested floor).
  tick-hz: 30
  # Target number of concurrent vehicles (density default). Up to 120 is supported via the control
  # panel, but a single protected intersection saturates around ~30 vehicles: above that, demand
  # outruns the available green time and queues build into a standstill over time. The default is
  # kept comfortably below that so traffic visibly flows rather than congealing into a jam.
  target-vehicles: 26
  # Approach length in meters (from approach edge to stop line).
  approach-length-m: 120.0
  # Lane width in meters.
  lane-width-m: 3.5
  # Half-width of the central intersection box in meters.
  intersection-half-m: 14.0
  # Deterministic RNG seed for spawning/routing (keeps runs reproducible).
  random-seed: 20260604
  # Default signal phase durations (seconds). The through greens are a touch long so a pedestrian
  # who steps off on the walk phase comfortably clears the carriageway before the light flips back.
  ns-green-seconds: 20.0
  ew-green-seconds: 20.0
  yellow-seconds: 3.0
  all-red-seconds: 2.0
  # Distance (m) before the stop line at which an emergency vehicle triggers preemption.
  emergency-trigger-m: 80.0

logging:
  level:
    com.trafficflow: INFO
